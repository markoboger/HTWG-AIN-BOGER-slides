<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="40 72 1040 520">
<text x="550" y="320" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">Software Development</text>
<text x="550" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">
<tspan x="550" dy="0">Software Architecture</tspan>
<tspan x="550" dy="17.5">The art of connecting solutions</tspan>
<tspan x="550" dy="17.5">to a system and maintaining it</tspan>
</text>
<text x="550" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">
<tspan x="550" dy="0">Software Engineering</tspan>
<tspan x="550" dy="17.5">The discipline of repeatably</tspan>
<tspan x="550" dy="17.5">finding solutions in teams</tspan>
</text>
<text x="180" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">
<tspan x="180" dy="0">Programming</tspan>
<tspan x="180" dy="17.5">The activity of solving a</tspan>
<tspan x="180" dy="17.5">problem with a computer</tspan>
</text>
<text x="930" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111" text-anchor="middle" font-weight="bold">
<tspan x="930" dy="0">Software Science</tspan>
<tspan x="930" dy="17.5">The science of what problems</tspan>
<tspan x="930" dy="17.5">have solutions and what they are</tspan>
</text>
<text x="550" y="580" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#009B91" text-anchor="middle" font-weight="normal">Video: https://www.youtube.com/watch?v=4wIwdsEObTA</text>
</svg>
