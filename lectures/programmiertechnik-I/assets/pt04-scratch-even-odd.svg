<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="500" viewBox="0 0 440 500">
  <defs>
    <filter id="s" x="-6%" y="-6%" width="112%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="440" height="500" fill="#FFFFFF"/>

  <!-- when green flag clicked -->
  <g filter="url(#s)">
    <path fill="#FFBF00" d="M28 18h30v10c0 6 4 10 10 10h210c8 0 14 6 14 14v18H28c-8 0-14-6-14-14V32c0-8 6-14 14-14z"/>
  </g>
  <circle cx="52" cy="46" r="9" fill="#4CBF56"/>
  <polygon points="49,41 49,51 58,46" fill="#fff"/>
  <text x="70" y="51" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1a1a1a">when green flag clicked</text>

  <!-- set evenCount to 0 -->
  <g filter="url(#s)"><rect x="28" y="78" width="360" height="36" rx="10" fill="#FF8C1A"/></g>
  <text x="44" y="101" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">set</text>
  <rect x="78" y="86" width="102" height="22" rx="11" fill="#FFB366"/>
  <text x="90" y="102" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">evenCount</text>
  <text x="190" y="101" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">to</text>
  <rect x="220" y="86" width="36" height="22" rx="11" fill="#fff"/>
  <text x="232" y="102" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">0</text>

  <!-- set oddCount to 0 -->
  <g filter="url(#s)"><rect x="28" y="120" width="360" height="36" rx="10" fill="#FF8C1A"/></g>
  <text x="44" y="143" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">set</text>
  <rect x="78" y="128" width="92" height="22" rx="11" fill="#FFB366"/>
  <text x="92" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">oddCount</text>
  <text x="182" y="143" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">to</text>
  <rect x="212" y="128" width="36" height="22" rx="11" fill="#fff"/>
  <text x="224" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">0</text>

  <!-- for each n in numbers — C block body -->
  <g filter="url(#s)">
    <path fill="#FFAB19" d="M28 164h370c8 0 14 6 14 14v28H52v220H28c-8 0-14-6-14-14V178c0-8 6-14 14-14z"/>
    <path fill="#FFAB19" d="M28 426h48v20c0 8 6 14 14 14h110c8 0 14-6 14-14v-8H42c-8 0-14-6-14-14z"/>
  </g>
  <text x="44" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">for each</text>
  <rect x="118" y="172" width="34" height="22" rx="11" fill="#FFB366"/>
  <text x="128" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">n</text>
  <text x="160" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">in</text>
  <rect x="188" y="172" width="100" height="22" rx="11" fill="#CF63CF"/>
  <text x="202" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">numbers</text>

  <!-- if n = 0 then stop -->
  <g filter="url(#s)">
    <path fill="#FFAB19" d="M52 212h330c8 0 14 6 14 14v26H76v44H52c-8 0-14-6-14-14V226c0-8 6-14 14-14z"/>
    <path fill="#FFAB19" d="M52 296h30v14c0 6 4 10 10 10h86c6 0 10-4 10-10v-6H66c-8 0-14-6-14-14z"/>
  </g>
  <text x="68" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">if</text>
  <rect x="92" y="220" width="88" height="22" rx="11" fill="#59C059"/>
  <text x="112" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">n = 0</text>
  <text x="192" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">then</text>
  <g filter="url(#s)"><rect x="76" y="254" width="170" height="30" rx="8" fill="#FF661A"/></g>
  <text x="96" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">stop this script</text>

  <!-- if-else even / odd -->
  <g filter="url(#s)">
    <!-- if head -->
    <path fill="#FFAB19" d="M52 320h330c8 0 14 6 14 14v26H76v40H52c-8 0-14-6-14-14V334c0-8 6-14 14-14z"/>
    <!-- else bridge -->
    <path fill="#FFAB19" d="M52 400h24v10h306v26H76v36H52c-8 0-14-6-14-14v-48c0-8 6-10 14-10z"/>
    <!-- bottom notch -->
    <path fill="#FFAB19" d="M52 472h30v10c0 6 4 10 10 10h90c6 0 10-4 10-10v-6H66c-8 0-14-4-14-10z"/>
  </g>
  <text x="68" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">if</text>
  <rect x="92" y="328" width="140" height="22" rx="11" fill="#59C059"/>
  <text x="104" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">n mod 2 = 0</text>
  <text x="244" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">then</text>
  <g filter="url(#s)"><rect x="76" y="360" width="220" height="30" rx="8" fill="#FF8C1A"/></g>
  <text x="90" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">change evenCount by 1</text>
  <text x="68" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#fff">else</text>
  <g filter="url(#s)"><rect x="76" y="434" width="210" height="30" rx="8" fill="#FF8C1A"/></g>
  <text x="90" y="454" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">change oddCount by 1</text>

  <!-- list caption -->
  <text x="28" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#575e75">numbers = [4, 7, 2, 9, 1, 6, 0]   →   even 3, odd 3</text>
</svg>
