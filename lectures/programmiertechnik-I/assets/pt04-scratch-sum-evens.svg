<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420">
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    .lab { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #fff; font-weight: 600; }
    .num { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12px; fill: #111; font-weight: 600; }
    .dark { fill: #111; }
  </style>

  <!-- green flag hat -->
  <path filter="url(#s)" d="M20 18 h200 a12 12 0 0 1 12 12 v22 H20 a12 12 0 0 1-12-12 V30 a12 12 0 0 1 12-12 z" fill="#FFBF00"/>
  <text class="lab dark" x="36" y="42">when green flag clicked</text>

  <!-- set sum to 0 -->
  <path filter="url(#s)" d="M20 58 h250 a10 10 0 0 1 10 10 v24 H20 a10 10 0 0 1-10-10 V68 a10 10 0 0 1 10-10 z" fill="#FF8C1A"/>
  <text class="lab" x="34" y="76">set</text>
  <rect x="62" y="64" width="52" height="20" rx="10" fill="#FFB366"/>
  <text class="num" x="74" y="78">sum</text>
  <text class="lab" x="120" y="76">to</text>
  <rect x="142" y="64" width="36" height="20" rx="10" fill="#fff"/>
  <text class="num" x="154" y="78">0</text>

  <!-- set i to 1 -->
  <path filter="url(#s)" d="M20 98 h250 a10 10 0 0 1 10 10 v24 H20 a10 10 0 0 1-10-10 V108 a10 10 0 0 1 10-10 z" fill="#FF8C1A"/>
  <text class="lab" x="34" y="116">set</text>
  <rect x="62" y="104" width="36" height="20" rx="10" fill="#FFB366"/>
  <text class="num" x="76" y="118">i</text>
  <text class="lab" x="106" y="116">to</text>
  <rect x="128" y="104" width="36" height="20" rx="10" fill="#fff"/>
  <text class="num" x="140" y="118">1</text>

  <!-- repeat (length of numbers) -->
  <path filter="url(#s)" d="M20 138 h290 a10 10 0 0 1 10 10 v28 H40 v150 H20 a10 10 0 0 1-10-10 V148 a10 10 0 0 1 10-10 z" fill="#FFAB19"/>
  <path d="M20 316 h40 v22 a10 10 0 0 0 10 10 h80 a10 10 0 0 0 10-10 v-8 H30 a10 10 0 0 1-10-10 z" fill="#FFAB19"/>
  <text class="lab" x="34" y="160">repeat</text>
  <rect x="88" y="146" width="150" height="22" rx="11" fill="#CF63CF"/>
  <text class="lab" x="100" y="161" style="font-size:12px">length of numbers</text>

  <!-- if (item i of numbers) mod 2 = 0 -->
  <path filter="url(#s)" d="M40 178 h280 a10 10 0 0 1 10 10 v26 H60 v52 H40 a10 10 0 0 1-10-10 V188 a10 10 0 0 1 10-10 z" fill="#FFAB19"/>
  <path d="M40 256 h30 v18 a8 8 0 0 0 8 8 h70 a8 8 0 0 0 8-8 v-6 H50 a10 10 0 0 1-10-10 z" fill="#FFAB19"/>
  <text class="lab" x="52" y="198">if</text>
  <rect x="72" y="184" width="230" height="22" rx="11" fill="#59C059"/>
  <text class="lab" x="82" y="199" style="font-size:11px">(item i of numbers) mod 2 = 0</text>

  <!-- change sum by item i -->
  <path filter="url(#s)" d="M60 216 h240 a10 10 0 0 1 10 10 v24 H60 a10 10 0 0 1-10-10 V226 a10 10 0 0 1 10-10 z" fill="#FF8C1A"/>
  <text class="lab" x="72" y="234">change</text>
  <rect x="128" y="222" width="48" height="20" rx="10" fill="#FFB366"/>
  <text class="num" x="138" y="236">sum</text>
  <text class="lab" x="182" y="234">by</text>
  <rect x="208" y="222" width="78" height="20" rx="10" fill="#CF63CF"/>
  <text class="lab" x="214" y="236" style="font-size:11px">item i …</text>

  <!-- change i by 1 -->
  <path filter="url(#s)" d="M40 280 h230 a10 10 0 0 1 10 10 v24 H40 a10 10 0 0 1-10-10 V290 a10 10 0 0 1 10-10 z" fill="#FF8C1A"/>
  <text class="lab" x="52" y="298">change</text>
  <rect x="108" y="286" width="36" height="20" rx="10" fill="#FFB366"/>
  <text class="num" x="122" y="300">i</text>
  <text class="lab" x="152" y="298">by</text>
  <rect x="178" y="286" width="36" height="20" rx="10" fill="#fff"/>
  <text class="num" x="190" y="300">1</text>

  <!-- say sum -->
  <path filter="url(#s)" d="M20 348 h200 a10 10 0 0 1 10 10 v24 H20 a10 10 0 0 1-10-10 V358 a10 10 0 0 1 10-10 z" fill="#9966FF"/>
  <text class="lab" x="34" y="366">say</text>
  <rect x="68" y="354" width="52" height="20" rx="10" fill="#FFB366"/>
  <text class="num" x="80" y="368">sum</text>

  <text x="20" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#575e75">numbers = [4, 7, 2, 9, 1, 6] → even sum</text>
</svg>
